name: Build macOS

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            package: TVBox-macOS-Intel
          - name: Apple Silicon
            runner: macos-15
            arch: arm64
            package: TVBox-macOS-AppleSilicon
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check native architecture and toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcode-select -p
          swift --version
          python3 scripts/ci-version.py

      - name: Cache official playback archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ThirdPartySources/VLCKit-3.7.3.tar.xz
            ThirdPartySources/ffmpeg-8.1.1.tar.xz
          key: playback-archives-${{ hashFiles('scripts/fetch-dependencies.py') }}

      - name: Prepare and verify playback dependencies
        run: bash scripts/prepare-vlc.sh

      - name: Run Core tests
        run: bash scripts/test.sh

      - name: Build and sign application
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-app.sh "$BUILD_ARCH"

      - name: Verify package and generate checksum
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 scripts/ci-verify-package.py "dist/$PACKAGE.zip"
          cd dist
          shasum -a 256 "$PACKAGE.zip" > "$PACKAGE.sha256"

      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}.zip
            dist/${{ matrix.package }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download successful builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TVBox-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          test -s TVBox-macOS-Intel.zip
          test -s TVBox-macOS-AppleSilicon.zip
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.zip ./*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 \
              --verify-tag --title "TVBox $RELEASE_TAG" --generate-notes
          fi
